<style>
:root{--bg:#0f1420;--card:#18202f;--card2:#232d42;--tx:#e8edf7;--mut:#8b97ad;--acc:#ffb703;--ok:#2ecc71;--bad:#ff5d5d;--blue:#4aa3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:var(--card2);border:1px solid #33405b;border-radius:10px;padding:8px 10px;cursor:pointer}
button:active{transform:scale(.97)}
button.pri{background:var(--acc);color:#1a1300;border-color:var(--acc);font-weight:700}
button.on{background:var(--blue);border-color:var(--blue);color:#001226;font-weight:700}
button:disabled{opacity:.4;cursor:default}
input,select{font:inherit;color:var(--tx);background:#0c111b;border:1px solid #33405b;border-radius:10px;padding:9px 10px;width:100%}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{flex:none;background:var(--card);padding:6px 10px;border-bottom:1px solid #2a3550;z-index:5}
#top .r1{display:flex;align-items:center;gap:8px;justify-content:space-between}
#top .r2{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.chip{background:var(--card2);border-radius:999px;padding:3px 9px;font-weight:600;white-space:nowrap}
.chip.g{color:var(--ok)}.chip.r{color:var(--bad)}
#cityname{font-weight:800;font-size:15px}
#mapwrap{flex:1;min-height:0;position:relative}
#map{position:absolute;inset:0;background:#cfd8e6}
#linebar{position:absolute;left:8px;right:8px;top:8px;z-index:500;display:none;gap:6px;flex-wrap:wrap}
#linebar.show{display:flex}
#linebar button{box-shadow:0 2px 8px #0008}
#events{position:absolute;left:8px;top:8px;z-index:490;display:flex;flex-direction:column;gap:4px;pointer-events:none}
#linebar.show~#events{top:52px}
.ev{background:#000b;border-radius:8px;padding:3px 8px;font-size:12px}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:52%;overflow:auto;background:var(--card);border-top:1px solid #2a3550;border-radius:16px 16px 0 0;z-index:600;padding:10px 12px 14px;display:none;box-shadow:0 -6px 20px #0008}
#sheet.show{display:block}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.row{display:flex;gap:8px;align-items:center;background:var(--card2);border-radius:12px;padding:8px;margin-bottom:7px}
.grow{flex:1;min-width:0}.col{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:150px}
.col button{padding:5px 8px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.muted{color:var(--mut);font-size:12px}
.bar{height:6px;background:#0c111b;border-radius:3px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}.bar i.red{background:var(--bad)}
#toolbar{flex:none;background:var(--card);border-top:1px solid #2a3550;padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;gap:5px;justify-content:space-between;z-index:5;overflow-x:auto}
#toolbar button{flex:none;padding:7px 9px;min-width:44px}
.sep{width:1px;background:#33405b;margin:0 2px;flex:none}
#modal{position:fixed;inset:0;background:#000b;z-index:2000;display:none;align-items:center;justify-content:center;padding:14px}
#modal.show{display:flex}
#mcard{background:var(--card);border-radius:16px;padding:16px;max-width:520px;width:100%;max-height:92vh;overflow:auto;border:1px solid #33405b}
#mcard h2{margin:0 0 8px;font-size:19px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.cards{display:grid;gap:7px}
.mode{display:flex;gap:8px;text-align:left;align-items:center;width:100%}
.mode .ic{font-size:26px}
.city{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin-bottom:5px}

.spin{width:34px;height:34px;border:4px solid #33405b;border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;margin:10px auto}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function dist(a,b){const x=(b.lng-a.lng)*Math.cos((a.lat+b.lat)*Math.PI/360)*111320,y=(b.lat-a.lat)*110540;return Math.hypot(x,y)}

 {id:'bogota',n:'Bogotá',c:'CO',lat:4.7110,lng:-74.0721,pop:11,cm:0.8,fare:0.8,car:19,q:1,fact:'Bogotá abrió TransMilenio, su BRT, en el año 2000.'},
 {id:'medellin',n:'Medellín',c:'CO',lat:6.2442,lng:-75.5812,pop:4,cm:0.8,fare:0.8,car:22,fact:'Medellín inauguró en 2004 su Metrocable, teleférico urbano de transporte.'},

 {id:'amsterdam',n:'Ámsterdam',c:'NL',lat:52.3676,lng:4.9041,pop:1.2,cm:1.8,fare:3.0,car:24,fact:'El metro de Ámsterdam abrió en 1977, y la ciudad además vive en bici.'},
 {id:'estambul',n:'Estambul',c:'TR',lat:41.0082,lng:28.9784,pop:15.5,cm:0.9,fare:0.8,car:16,q:1,fact:'Marmaray conecta Europa y Asia bajo el Bósforo.'},

 {id:'lagos',n:'Lagos',c:'NG',lat:6.5244,lng:3.3792,pop:15,cm:0.6,fare:0.4,car:14,fact:'La Línea Azul de Lagos abrió en 2023.'}

const CITY={};CITIES.forEach(c=>CITY[c.id]=c);

function lineKm(S,L){let d=0;for(let i=1;i<L.st.length;i++)d+=dist(S.sm[L.st[i-1]],S.sm[L.st[i]]);return d/1000}
function lineHeadway(S,L){return MODES[L.mode].head/(1+0.22*S.up.freq+0.25*L.lv)}
function lineCap(S,L){return MODES[L.mode].cap*(1+0.35*S.up.cap)*(1+0.5*L.lv)}
function lineSpeed(S,L){return MODES[L.mode].speed*(1+0.05*S.up.sig)}
function segCost(S,mode,a,b){const m=MODES[mode];let k=m.km*S.cm*dist(a,b)/1000;if(m.under){const c=dist({lat:(a.lat+b.lat)/2,lng:(a.lng+b.lng)/2},S.center)/1000;k*=1+0.8*Math.exp(-c/6)}return k*S.dc}
function stCost(S,mode){return MODES[mode].st*S.cm*S.dc}
function upgCost(S,u,lvl){return Math.round(u.base*S.cm*S.dc*(1+lvl*0.9))}
function lineUpCost(S,L){return Math.round(MODES[L.mode].st*2.5*S.cm*S.dc*(1+L.lv)*(1+lineKm(S,L)/10))}

function buildPairs(S){
 const nd=S.nodes,n=nd.length,I=[],J=[],T=[],D=[];let sum=0;
 for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const d=dist(nd[i],nd[j])/1000;const g=nd[i].w*nd[j].w/Math.pow(d+2,1.3);I.push(i);J.push(j);D.push(d);T.push(g);sum+=g}
 for(let k=0;k<T.length;k++)T[k]=sum?T[k]/sum*S.dtot:0;
 S.pairs={I,J,T,D};
}
function hpush(h,x){h.push(x);let i=h.length-1;while(i>0){const p=(i-1)>>1;if(h[p][0]<=h[i][0])break;const t=h[p];h[p]=h[i];h[i]=t;i=p}}
function hpop(h){const top=h[0],last=h.pop();if(h.length){h[0]=last;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;if(l<h.length&&h[l][0]<h[m][0])m=l;if(r<h.length&&h[r][0]<h[m][0])m=r;if(m===i)break;const t=h[m];h[m]=h[i];h[i]=t;i=m}}return top}

function evaluate(S){
 const nodes=S.nodes,n=nodes.length,ls=S.lines.filter(l=>l.st.length>=2);
 const E={riders:0,rev:0,maint:0,cov:0,sat:0,co2:0,km:0,nst:0,xfer:0,lines:{},acc:new Array(n).fill(false),avgT:0,nlines:ls.length,avgF:1};
 if(!ls.length)return E;
 const sm=S.sm,states=[],adj=[],byS={},walk={},stM={};
 ls.forEach((L,li)=>{
  const m=MODES[L.mode],base=states.length,sp=lineSpeed(S,L);E.km+=lineKm(S,L);
  L.st.forEach((sid,k)=>{states.push({li});adj.push([]);(byS[sid]=byS[sid]||[]).push(base+k);walk[sid]=Math.max(walk[sid]||0,m.walk);stM[sid]=Math.max(stM[sid]||0,m.sm)});
  for(let k=0;k<L.st.length-1;k++){const t=dist(sm[L.st[k]],sm[L.st[k+1]])/1000/sp*60+m.dwell;adj[base+k].push([base+k+1,t]);adj[base+k+1].push([base+k,t])}
 });

 S.lines.push({id,name:`${MODES[mode].pre} ${id}`,color:PAL[(id-1)%PAL.length],mode,lv:0,st:[]});

function upgradeLine(id){

 const c=lineUpCost(S,l);if(!canPay(c)){toast('Fondos insuficientes: '+fmt(c));return}
 pay(c);l.lv++;markDirty(false);toast(`${l.name}: más trenes (nivel ${l.lv})`);
}
function deleteLine(id){
 const l=S.lines.find(x=>x.id===id);if(!confirm(`¿Eliminar ${l.name}? Recuperas el 30% del costo de los tramos.`))return;
 let ref=0;for(let i=1;i<l.st.length;i++)ref+=segCost(S,l.mode,S.sm[l.st[i-1]],S.sm[l.st[i]])*0.3;
 if(S.diff!=='sandbox')S.money+=ref;S.lines=S.lines.filter(x=>x.id!==id);if(UI.lineId===id)UI.lineId=S.lines.length?S.lines[0].id:null;UI.undo=null;markDirty(true);

/* ---------- Economía / tick ---------- */
function markDirty(redraw){dirty=true;if(redraw)drawNetwork();clearTimeout(evalT);evalT=setTimeout(evalNow,120);updateTop()}
function evalNow(){
 if(!S)return;E=evaluate(S);dirty=false;drawDemand();checkAch();renderAll();
 if(prevRiders!==null&&E.riders>prevRiders+50){toast(`📈 +${fmtN(E.riders-prevRiders)} pasajeros/día`,1800)}prevRiders=null;
}
function checkAch(){
 for(const a of ACH){if(!S.ach[a.id]&&a.f(S,E)){S.ach[a.id]=1;const r=a.r*S.cm;if(S.diff!=='sandbox')S.money+=r;news(`🏆 ${a.n}`);toast(`🏆 ${a.n} · +${fmt(r)}`,3500)}}
}
function tick(){
 if(!S)return;if(dirty)evalNow();
 S.month++;
 if(S.diff!=='sandbox')S.money+=E.rev-E.maint;
 let changed=false;
 for(const e of S.ev){e.left--}
 if(S.ev.some(e=>e.left<=0)){S.ev=S.ev.filter(e=>e.left>0);changed=true}
 if(S.stations.length>2&&Math.random()<0.13*DIFF[S.diff].ev){
  const cityQ=CITY[S.city].q;const pool=EVENTS.filter(e=>(!e.only||cityQ)&&!S.ev.some(x=>x.id===e.id));
  const ev=pool[Math.floor(Math.random()*pool.length)];
  if(ev){if(ev.cash&&S.diff!=='sandbox')S.money+=ev.cash*S.cm;if(ev.left>0){S.ev.push({id:ev.id,left:ev.left,mult:ev.mult,sat:ev.sat,t:ev.t});changed=true}news(ev.t);toast(ev.t,3800)}
 }
 if(S.diff!=='sandbox'&&S.money<-40000*S.cm){S.money=15000*S.cm;S.rescues=(S.rescues||0)+1;news('🏦 Rescate financiero del gobierno');toast('🏦 Rescate financiero: el gobierno te inyecta fondos',4000)}
 if(changed)dirty=true;
 if(S.month%6===0)news(`Ingresos ${fmt(E.rev)} · Mantenimiento ${fmt(E.maint)}`);
 if(dirty)evalNow();else{checkAch();renderAll()}
 if(S.month%3===0)saveLocal();
 if(S.month%10===0)cloudSave(false);
}

/* ---------- Guardado compacto ---------- */
function serialize(S){
 const names=[],ix=new Map(),nm=s=>{s=s||'';if(!ix.has(s)){ix.set(s,names.length);names.push(s)}return ix.get(s)};
 let a=0,b=0;const st=[];
 for(const s of S.stations){const la=Math.round(s.lat*1e5),lo=Math.round(s.lng*1e5);st.push(s.id,la-a,lo-b,nm(s.name));a=la;b=lo}
 a=0;b=0;const nd=[];
 for(const n of S.nodes){const la=Math.round(n.lat*1e5),lo=Math.round(n.lng*1e5);nd.push(la-a,lo-b,Math.round(n.w*10),n.k,nm(n.name));a=la;b=lo}
 return{v:1,ts:Date.now(),c:S.city,d:S.diff,mo:S.month,m:Math.round(S.money),f:S.fare,u:S.up,a:Object.keys(S.ach),ni:S.nid,li:S.lid,nm:names,st,nd,ln:S.lines.map(l=>[l.id,l.name,l.color,l.mode,l.lv,l.st]),ev:S.ev,lg:S.log.slice(0,15),rs:S.rescues||0};
}
function deserialize(o){
 const S={v:1,city:o.c,diff:o.d,month:o.mo,money:o.m,fare:o.f,up:o.u,ach:{},ev:o.ev||[],log:o.lg||[],nid:o.ni,lid:o.li,stations:[],lines:[],nodes:[],rescues:o.rs||0};
 o.a.forEach(k=>S.ach[k]=1);UPG.forEach(u=>{if(S.up[u.id]==null)S.up[u.id]=0});
 let a=0,b=0;for(let i=0;i<o.st.length;i+=4){a+=o.st[i+1];b+=o.st[i+2];S.stations.push({id:o.st[i],lat:a/1e5,lng:b/1e5,name:o.nm[o.st[i+3]]})}
 a=0;b=0;for(let i=0;i<o.nd.length;i+=5){a+=o.nd[i];b+=o.nd[i+1];S.nodes.push({lat:a/1e5,lng:b/1e5,w:o.nd[i+2]/10,k:o.nd[i+3],name:o.nm[o.nd[i+4]]})}
 S.lines=o.ln.map(x=>({id:x[0],name:x[1],color:x[2],mode:x[3],lv:x[4],st:x[5]}));
 hydrate(S);return S;
}
function b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
function b64d(s){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function pack(obj){
 const bytes=new TextEncoder().encode(JSON.stringify(obj));
 if(window.CompressionStream){const cs=new CompressionStream('gzip'),w=cs.writable.getWriter();w.write(bytes);w.close();return 'G'+b64(new Uint8Array(await new Response(cs.readable).arrayBuffer()))}
 return 'R'+b64(bytes);
}
async function unpack(str){
 const bytes=b64d(str.slice(1));
 if(str[0]==='G'){const ds=new DecompressionStream('gzip'),w=ds.writable.getWriter();w.write(bytes);w.close();return JSON.parse(new TextDecoder().decode(await new Response(ds.readable).arrayBuffer()))}
 return JSON.parse(new TextDecoder().decode(bytes));
}
function lsKey(city){return 'mp_'+(Cloud.user||'local')+'_'+city}
async function saveLocal(){if(!S)return;try{localStorage.setItem(lsKey(S.city),await pack(serialize(S)))}catch(e){}}
async function cloudSave(manual){
 if(!Cloud.on||!S||Cloud.busy)return;Cloud.busy=true;
 try{
  const data=await pack(serialize(S)),chunks=[];for(let i=0;i<data.length;i+=40000)chunks.push(data.slice(i,i+40000));
  const st=statsOf(S,E||evaluate(S));
  const r=await cloudCall('save',{city:S.city,stats:st,chunks});
  if(r.ok){Cloud.last=Date.now();Cloud.score=r.puntaje;Cloud.lastErr='';if(manual)toast('☁ Guardado en tu Google Sheet · puntaje '+fmtN(r.puntaje))}
  else{Cloud.lastErr=r.error||'error';if(manual)toast('No se pudo guardar: '+Cloud.lastErr,4000)}
 }catch(e){Cloud.lastErr=String(e);if(manual)toast('Sin conexión con el Sheet; se guardó en este dispositivo',4000)}
 Cloud.busy=false;if(UI.tab==='more')renderSheet();
}
async function manualSave(){await saveLocal();if(Cloud.on)await cloudSave(true);else toast('💾 Guardado en este dispositivo')}
async function cloudCall(action,d){
 const r=await fetch(Cloud.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,user:Cloud.user,pin:Cloud.pin},d||{}))});
 return r.json();
}
async function loadSave(city){
 let loc=null,cl=null;
 try{const s=localStorage.getItem(lsKey(city));if(s)loc=await unpack(s)}catch(e){}
 if(Cloud.on&&Cloud.parts[city]){try{const r=await cloudCall('load',{city});if(r.ok&&r.data)cl=await unpack(r.data)}catch(e){}}
 const best=(cl&&(!loc||cl.ts>=loc.ts))?cl:loc;
 return best?deserialize(best):null;
}
function normUser(u){return String(u||'').trim().toLowerCase().replace(/[^a-z0-9_.-]/g,'').slice(0,24)}

/* ---------- Ciudades: datos reales de OpenStreetMap ---------- */
const OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
function cityRadius(c){return Math.max(5000,Math.min(16000,4000+c.pop*1100))}
async function fetchNodes(city){
 const key='mp_nodes_'+city.id;
 try{const c=localStorage.getItem(key);if(c){const j=JSON.parse(c);if(j&&j.length>=20)return j}}catch(e){}
 const R=Math.round(cityRadius(city)),a=`(around:${R},${city.lat},${city.lng})`;
 const q=`[out:json][timeout:25];(node["place"~"^(suburb|neighbourhood|quarter|town|village|city_block)$"]${a};nwr["amenity"~"^(university|college|hospital|marketplace)$"]${a};nwr["shop"="mall"]${a};nwr["leisure"="stadium"]${a};nwr["aeroway"="aerodrome"]${a};nwr["railway"="station"]["name"]${a};nwr["tourism"="attraction"]["name"]${a};);out center tags 500;`;
 let els=[];
 for(const ep of OVERPASS){
  try{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),24000);
   const r=await fetch(ep,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ctl.signal});clearTimeout(to);
   if(!r.ok)continue;const j=await r.json();els=j.elements||[];if(els.length)break}catch(e){}
 }
 const nodes=buildNodes(city,els,R);
 if(els.length>=15){try{localStorage.setItem(key,JSON.stringify(nodes))}catch(e){}}
 return nodes;
}
function buildNodes(city,els,R){
 const rng=mulberry32(hashStr(city.id)),raw=[];
 for(const e of els){
  const t=e.tags||{},lat=e.lat!=null?e.lat:(e.center&&e.center.lat),lng=e.lon!=null?e.lon:(e.center&&e.center.lon);if(lat==null||lng==null)continue;
  let k=t.place||((t.amenity==='university'||t.amenity==='college'||t.amenity==='hospital'||t.amenity==='marketplace')?t.amenity:null)||(t.shop==='mall'?'mall':null)||(t.leisure==='stadium'?'stadium':null)||(t.aeroway?'aerodrome':null)||(t.railway?'station':null)||(t.tourism?'attraction':null);
  if(!k||!KW[k])continue;
  raw.push({lat,lng,k,w:KW[k]*(0.7+0.6*rng()),name:t.name||''});
 }
 raw.sort((a,b)=>b.w-a.w);
 const out=[];
 for(const n of raw){if(out.every(o=>dist(o,n)>250)){if(!n.name)n.name=KINDS[n.k];out.push(n)}if(out.length>=190)break}
 const c={lat:city.lat,lng:city.lng};
 out.forEach(n=>{const dc=dist(n,c)/1000;n.w*=1+1.6*Math.exp(-dc/(R/1000*0.3))});
 let z=1;
 while(out.length<35){const u=rng()||1e-9,v=rng(),r=Math.sqrt(-2*Math.log(u))*(R/2.6),th=2*Math.PI*v;
  const lat=c.lat+r*Math.sin(th)/110540,lng=c.lng+r*Math.cos(th)/(111320*Math.cos(c.lat*Math.PI/180));
  if(out.every(o=>dist(o,{lat,lng})>300)){out.push({lat,lng,k:'zona',w:(15+rng()*20)*(1+1.2*Math.exp(-r/R*3)),name:'Zona '+z});z++}else if(z++>400)break}
 return out.map(n=>({lat:Math.round(n.lat*1e5)/1e5,lng:Math.round(n.lng*1e5)/1e5,k:n.k,w:Math.round(n.w*10)/10,name:n.name}));
}
function hydrate(S){
 const c=CITY[S.city];S.cm=c.cm;S.car=c.car;S.cityFare=c.fare;S.dc=DIFF[S.diff].c;S.dtot=1e6*Math.pow(c.pop,0.8)*4;S.center={lat:c.lat,lng:c.lng};
 S.sm={};S.stations.forEach(s=>S.sm[s.id]=s);S.totW=S.nodes.reduce((a,n)=>a+n.w,0);
}
function newState(city,diff){
 const S={v:1,city:city.id,diff,month:1,money:Math.round(120000*city.cm*DIFF[diff].m),fare:city.fare,up:{},stations:[],lines:[],nodes:[],ach:{},ev:[],log:[],nid:1,lid:1,rescues:0};
 UPG.forEach(u=>S.up[u.id]=0);return S;
}

/* ---------- Arranque / menús ---------- */
async function startGame(cityId,diff,fresh){
 const city=CITY[cityId];clearInterval(timer);
 showLoading(`Cargando ${city.n}…`);
 try{
  let st=fresh?null:await loadSave(cityId);
  if(!st){
   showLoading('Descargando barrios y lugares reales de OpenStreetMap…');
   const nodes=await fetchNodes(city);st=newState(city,diff);st.nodes=nodes;hydrate(st);
  }
  S=st;buildPairs(S);UI.lineId=S.lines.length?S.lines[0].id:null;UI.undo=null;UI.tab=null;
  initMap();map.setView([city.lat,city.lng],13);
  prevRiders=null;E=evaluate(S);dirty=false;
  drawDemand();drawNetwork();setTool('explore');setSpeed(UI.speed||1);renderAll();
  closeModal();
  const first=!localStorage.getItem('mp_seen');
  if(first||S.month===1&&!S.stations.length){modal(`<h2>${esc(city.n)}</h2><p class="muted">${esc(city.fact)}</p><p>Hemos cargado barrios, universidades, hospitales y otros puntos reales: son la <b>demanda</b> (🟠 sin servicio, 🟢 con servicio).</p><p style="text-align:right;margin-bottom:0"><button onclick="closeModal();helpModal()">❓ Cómo jugar</button> <button class="pri" onclick="closeModal()">¡A construir!</button></p>`);localStorage.setItem('mp_seen','1')}
  else toast('Bienvenido de vuelta · '+city.n);
  setTimeout(()=>map.invalidateSize(),200);
 }catch(err){modal(`<h2>No se pudo cargar</h2><p class="muted">${esc(String(err))}</p><button onclick="cityMenu()">Volver</button>`)}
}
function helpModal(){
 modal(`<h2>Cómo jugar</h2><div class="cards">
 <div class="row"><span>1️⃣</span><div>Pulsa <b>🔨 Construir</b>, crea una línea y <b>toca el mapa</b>: cada toque coloca una estación y la une a la anterior.</div></div>
 <div class="row"><span>2️⃣</span><div>Cubre las zonas <b>🟠 naranjas</b> (demanda sin servicio). Cerca de ellas = más pasajeros. El centro y los grandes polos (universidades, aeropuertos, estadios) pesan más.</div></div>
 <div class="row"><span>3️⃣</span><div>Haz que las líneas <b>se crucen</b>: los transbordos conectan la red y multiplican los viajes posibles.</div></div>
 <div class="row"><span>4️⃣</span><div>Cada mes cobras tarifas y pagas mantenimiento. Reinvierte en <b>⬆ mejoras</b>, más trenes por línea y nuevos modos de transporte.</div></div>
 <div class="row"><span>5️⃣</span><div>Si una línea se satura (barra roja) pierdes pasajeros: añade trenes o una línea paralela. Cumple <b>🏆 metas</b> para ganar premios.</div></div>
 <div class="row"><span>☁</span><div>Tu progreso se guarda comprimido (estaciones, líneas y mapa de demanda) y se resume en un <b>puntaje</b> que calcula tu Google Sheet.</div></div></div>
 <p style="text-align:right;margin-bottom:0"><button class="pri" onclick="closeModal()">Entendido</button></p>`);
}
function loginModal(msg){
 modal(`<h2>🚇 Metrópolis</h2><p class="muted">Construye el transporte público de ciudades reales. Inicia sesión para guardar tu progreso en la nube (tu Google Sheet).</p>
 <p style="margin:8px 0 3px">Usuario</p><input id="lUser" autocomplete="username" value="${esc(localStorage.getItem('mp_user')||'')}" placeholder="angel">
 <p style="margin:8px 0 3px">PIN (4+ dígitos; si es tu primera vez se crea la cuenta)</p><input id="lPin" type="password" inputmode="numeric" autocomplete="current-password">
 <p style="margin:8px 0 3px">URL del Apps Script (Google Sheet)</p><input id="lUrl" value="${esc(localStorage.getItem('mp_url')||DEFAULT_SHEET_URL)}" placeholder="https://script.google.com/macros/s/…/exec">
 ${msg?`<p style="color:var(--bad)">${esc(msg)}</p>`:''}
 <div class="grid" style="margin-top:10px"><button class="pri" onclick="doLogin()">Entrar</button><button onclick="playOffline()">Jugar sin cuenta</button></div>
 <p class="muted">Sin cuenta: se guarda solo en este dispositivo.</p>`);
}
async function doLogin(){
 const user=normUser($('lUser').value),pin=$('lPin').value,url=$('lUrl').value.trim();
 if(!url){playOffline($('lUser').value);return}
 if(user.length<3)return loginModal('El usuario necesita 3 o más letras/números');
 if(pin.length<4)return loginModal('El PIN necesita 4 o más caracteres');
 showLoading('Conectando con tu Google Sheet…');
 Cloud.url=url;Cloud.user=user;Cloud.pin=pin;
 try{
  const r=await cloudCall('login');
  if(!r.ok){Cloud.on=false;return loginModal(r.error||'No se pudo entrar')}
  Cloud.on=true;Cloud.parts={};(r.partidas||[]).forEach(p=>Cloud.parts[p.ciudad]=p);
  localStorage.setItem('mp_user',user);localStorage.setItem('mp_url',url);
  if(r.nuevo)toast('Cuenta creada. ¡Bienvenido, '+user+'!',3000);
  cityMenu();
 }catch(e){Cloud.on=false;loginModal('No se pudo conectar con el Sheet. Revisa la URL (debe terminar en /exec y estar implementada para "Cualquier persona").')}
}
function playOffline(u){Cloud.on=false;Cloud.user=normUser(u||($('lUser')&&$('lUser').value))||'local';Cloud.parts={};cityMenu()}
function logout(){clearInterval(timer);S=null;Cloud.on=false;Cloud.pin='';closeModalTab();loginModal()}
function closeModalTab(){UI.tab=null;$('sheet').className=''}
let selCity=null,selDiff='normal';
function cityMenu(filter){
 clearInterval(timer);timer=null;if(S)saveLocal();if(S&&Cloud.on)cloudSave(false);
 filter=(filter||'').toLowerCase();
 const list=CITIES.filter(c=>!filter||c.n.toLowerCase().includes(filter));
 let h=`<h2>Elige tu ciudad</h2><input id="cSearch" placeholder="Buscar ciudad…" value="${esc(filter)}" oninput="cityMenu(this.value)" style="margin-bottom:8px">`;
 h+='<div style="max-height:38vh;overflow:auto">';
 for(const c of list){const p=Cloud.parts[c.id],loc=!!localStorage.getItem(lsKey(c.id));
  h+=`<button class="city ${selCity===c.id?'sel':''}" onclick="selCity='${c.id}';cityMenu($('cSearch').value)"><span><b>${esc(c.n)}</b> <span class="muted">${c.c} · ${c.pop} M hab.</span></span><span class="muted">${p?'⭐ '+fmtN(p.puntaje):loc?'💾':''}</span></button>`}
 h+='</div>';
 const sc=selCity&&CITY[selCity];
 if(sc){const has=!!Cloud.parts[sc.id]||!!localStorage.getItem(lsKey(sc.id));
  h+=`<p class="muted" style="margin:8px 0">${esc(sc.fact)}</p><select id="dSel" onchange="selDiff=this.value">${Object.keys(DIFF).map(k=>`<option value="${k}" ${selDiff===k?'selected':''}>${DIFF[k].n}</option>`).join('')}</select>
  <div class="grid" style="margin-top:8px">${has?`<button class="pri" onclick="startGame('${sc.id}',selDiff,false)">▶ Continuar</button><button onclick="if(confirm('Se perderá el avance de esta ciudad. ¿Empezar de cero?'))startGame('${sc.id}',selDiff,true)">Nueva partida</button>`:`<button class="pri" style="grid-column:span 2" onclick="startGame('${sc.id}',selDiff,true)">▶ Jugar en ${esc(sc.n)}</button>`}</div>`;
 }
 if(S)h+='<p style="text-align:right;margin:10px 0 0"><button onclick="closeModal();startTimer()">Cerrar</button></p>';
 modal(h);
 const i=$('cSearch');if(i&&filter){i.focus();i.setSelectionRange(filter.length,filter.length)}
}
async function showRanking(){
 showLoading('Cargando ranking…');
 try{const r=await cloudCall('top');if(!r.ok)throw new Error(r.error);
  modal(`<h2>🏅 Ranking</h2>${(r.top||[]).map((x,i)=>`<div class="row"><b>${i+1}</b><div class="grow">${esc(x.usuario)}</div><b>${fmtN(x.total)}</b></div>`).join('')||'<p class="muted">Aún no hay jugadores.</p>'}<p style="text-align:right"><button onclick="closeModal()">Cerrar</button></p>`);
 }catch(e){modal('<p>No se pudo cargar el ranking.</p><button onclick="closeModal()">Cerrar</button>')}
}

window.addEventListener('pagehide',()=>{if(S)saveLocal()});
window.addEventListener('DOMContentLoaded',()=>{loginModal()});
</script>
